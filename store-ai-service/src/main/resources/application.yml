server:
  port: 8085

spring:
  application:
    name: store-ai-service

spring.cloud.openfeign:
  circuitbreaker:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

internal:
  api-key: ${INTERNAL_API_KEY}

jwt:
  secret-key: ${JWT_SECRET_KEY}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-2.5-flash
  api-version: v1beta